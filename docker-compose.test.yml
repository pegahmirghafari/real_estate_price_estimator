services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - test-network

  test:
    build:
      context: .
      dockerfile: Dockerfile.test

    depends_on:
      api:
        condition: service_healthy

    environment:
      API_BASE_URL: http://api:8000

    volumes:
      - ./test-results:/app/test-results
      - ./test:/app/test:ro
      - ./src:/app/src:ro
      - ./benchmark.py:/app/benchmark.py:ro
      - ./benchmark_loading.py:/app/benchmark_loading.py:ro

    networks:
      - test-network

networks:
  test-network:
    driver: bridge
